<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Broadcast three-click swing</title></head><body style="margin:0;padding:24px;background:#111713">
<div id="golf-bar">
<style>
#golf-bar{--foreground:#f4f5ef;--muted:#303631;--border:#626a60;--viz-series-1:#20dedc;--orange:#e7b76a;font:14px/1.45 system-ui,sans-serif;color:var(--foreground);max-width:1100px;margin:auto;display:grid;gap:8px}
#golf-bar *{box-sizing:border-box}#golf-bar h3{font-size:18px;font-weight:500;margin:0}
#golf-bar .broadcast{display:grid;grid-template-columns:170px minmax(0,1fr) 190px;gap:8px;align-items:stretch}
#golf-bar .side,#golf-bar .center{background:linear-gradient(180deg,#22272a,#101518);border:1px solid #535b61;border-radius:22px;padding:10px 14px}
#golf-bar .side{display:flex;flex-direction:column;justify-content:center;gap:9px}
#golf-bar .club-name{font-size:23px;font-weight:500}#golf-bar .club-name[hidden],#golf-bar [hidden]{display:none}
#golf-bar .side-split{padding:0;gap:0;justify-content:stretch}
#golf-bar .side-top{flex:1;display:flex;align-items:center;padding:14px 16px}
#golf-bar .side-bottom{flex:1;display:flex;align-items:center;padding:12px 16px;border-top:1px solid #727b6590}
#golf-bar .lie-pic{display:block;width:100%;height:92px;background-size:cover;background-position:center;border-radius:8px}
#golf-bar .club-pick{font-size:16px;padding:8px 10px}#golf-bar .sub{color:#c3cbbd;font-size:12px;text-transform:uppercase;letter-spacing:1px}
#golf-bar #gb-track{display:block;width:100%;height:150px}#golf-bar #gb-track text{fill:var(--foreground);font:12px system-ui,sans-serif}#golf-bar .meter{height:32px;margin:18px 0 8px;position:relative;background:var(--muted);overflow:hidden;border-radius:7px}
#golf-bar .fill{position:absolute;inset:0 auto 0 0;background:var(--viz-series-1);opacity:.75}
#golf-bar .zone{position:absolute;top:0;bottom:0;background:var(--viz-series-1);opacity:.5}
#golf-bar .needle{position:absolute;top:0;bottom:0;width:3px;background:var(--foreground)}
#golf-bar .danger{position:absolute;left:90.9%;right:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 4px,#d9dfce55 4px 6px)}
#golf-bar .labels,#golf-bar .viz-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#golf-bar .viz-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;padding:15px 0}
#golf-bar .form-label{display:grid;gap:7px}#golf-bar select,#golf-bar input{width:100%;color:inherit;accent-color:#20dedc}
#golf-bar select{background:#222a25;border:1px solid #727b65;border-radius:5px;padding:9px;font:inherit}
#golf-bar .btn{background:#242e27;color:inherit;border:1px solid #727b65;border-radius:7px;padding:11px 18px;font:inherit;cursor:pointer}
#golf-bar .btn-primary{background:#20dedc;color:#102223;border-color:#20dedc}#golf-bar button:disabled{opacity:.4;cursor:default}
#golf-bar .text-small{font-size:12px}#golf-bar .tabular-nums{font-variant-numeric:tabular-nums}
#golf-bar details{background:#19201e;border-radius:8px;padding:14px}#golf-bar summary{cursor:pointer}
#golf-bar .center > .labels,#golf-bar #gb-track text,#golf-bar #gb-cancel,#golf-bar #gb-rules,#golf-bar .viz-row > .text-small{display:none}
#golf-bar .viz-row{justify-content:center}
#golf-bar :focus-visible{outline:2px solid #20dedc;outline-offset:3px}
@media(max-width:700px){#golf-bar .broadcast{grid-template-columns:1fr 1fr}#golf-bar .center{grid-column:1/-1;grid-row:2}#golf-bar .side{padding:12px}}
</style>
<div class="broadcast">
<div class="side side-split"><div class="side-top"><select class="form-select club-pick" id="gb-club" aria-label="Club"><option value="driver">Driver</option><option value="iron">7 iron</option><option value="wedge">Wedge</option></select><span class="club-name" id="gb-club-summary" hidden>7 IRON</span></div><div class="side-bottom"><span class="sub" id="gb-lie-summary">Fairway</span></div></div>
<div class="center"><div class="labels"><span id="gb-phase">1 · Start swing</span><span class="tabular-nums" id="gb-value">Target 90% · Driver</span></div>
<svg id="gb-track" role="img" aria-label="Power bar above accuracy bar, joined by a continuous right-hand curve"><title>Three-click swing track</title></svg>
<div class="viz-row"><button type="button" class="btn btn-primary" id="gb-swing">Start swing</button><button type="button" class="btn" id="gb-cancel" disabled>Cancel swing</button><span class="text-small">Space or button · three presses</span></div>
<div class="text-small" id="gb-rules"></div></div>
<div class="side side-split"><div class="side-top"><select class="form-select club-pick" id="gb-shape-pick" aria-label="Shape"><option value="0">Straight</option><option value="-1">Draw</option><option value="1">Fade</option></select><span id="gb-shape-summary" hidden>STRAIGHT</span></div><div class="side-bottom"><select class="form-select club-pick" id="gb-flight-pick" aria-label="Flight"></select><span class="sub" id="gb-height-summary" hidden>NORMAL HEIGHT</span></div></div>
</div>
<div aria-live="polite" id="gb-result">Three presses: start → power → strike</div>
<details><summary>Demo conditions and shot setup</summary><div class="viz-controls">
<label class="form-label">Lie <select class="form-select" id="gb-lie"><option value="fairway">Fairway</option><option value="light">Light rough</option><option value="deep">Deep rough</option><option value="fairwaySand">Fairway bunker</option><option value="tee">Tee</option><option value="tree">Trees · punch out</option><option value="green">Green · putt or chip</option><option value="greenSand">Greenside bunker · splash</option></select></label>
<label class="form-label">Along-shot wind <span id="gb-wind-value">Calm</span><input class="form-range" id="gb-wind" type="range" min="-20" max="20" value="0"></label>
<label class="form-label">Crosswind <span id="gb-cross-value">Calm</span><input class="form-range" id="gb-cross" type="range" min="-20" max="20" value="0"></label>
<label class="form-label">Aim offset <span id="gb-aim-value">0 yd</span><input class="form-range" id="gb-aim" type="range" min="-40" max="40" value="0"></label>
<label class="form-label">Shot <select class="form-select" id="gb-shot"><option value="normal">Normal</option><option value="punch">Punch</option><option value="flop">Flop · wedge only</option><option value="splash" disabled>Splash · greenside bunker</option></select></label>
<label class="form-label">Calm-air target power <span id="gb-target-value">90%</span><input class="form-range" id="gb-target" type="range" min="10" max="110" value="90"></label>
<label class="form-label">Shape <select class="form-select" id="gb-shape"><option value="0">Straight</option><option value="-1">Draw · right to left</option><option value="1">Fade · left to right</option></select></label>
<label class="form-label">Height <select class="form-select" id="gb-height"><option value="0">Normal</option><option value="-1">Low</option><option value="1">High</option></select></label>
<label class="form-label">Shape strength <span id="gb-strength-value">50%</span><input class="form-range" id="gb-strength" type="range" min="0" max="100" value="50"></label>
</div>
</details>
</div>
<script>
(() => {
const root=document.getElementById('golf-bar'), q=id=>root.querySelector('#gb-'+id);
const shape=q('shape'),height=q('height'),strength=q('strength'),button=q('swing');
const club=q('club'),shot=q('shot'),target=q('target');
const lie=q('lie'),wind=q('wind'),cross=q('cross'),aim=q('aim');
const lies={fairway:{name:'Fairway',carry:1,spin:1,window:0},light:{name:'Light rough',carry:.94,spin:.8,window:8},deep:{name:'Deep rough',carry:.78,spin:.45,window:22},fairwaySand:{name:'Fairway bunker',carry:.96,spin:.85,window:25},greenSand:{name:'Greenside bunker',carry:1,spin:.9,window:0},green:{name:'Green',carry:1,spin:1,window:0},tree:{name:'Trees',carry:.6,spin:.5,window:40},tee:{name:'Tee',carry:1,spin:1,window:0}};
const clubs={driver:{name:'Driver',carry:250,window:60},iron:{name:'7 iron',carry:155,window:85},wedge:{name:'Wedge',carry:90,window:110}};
let powerDuration=1400,curveDuration=267,strikeDuration=764;
let phase='ready',start=0,power=90,error=0,raf=0,last=null,elapsed=0,powerMark=null,accuracyMark=null,powerLocked=false;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function restore(s){const m=s?.modelContent;if(!m)return;shape.value=['-1','0','1'].includes(String(m.shape))?String(m.shape):'0';height.value=['-1','0','1'].includes(String(m.height))?String(m.height):'0';strength.value=clamp(Number(m.strength)||0,0,100);club.value=clubs[m.club]?m.club:'driver';shot.value=['normal','punch','flop'].includes(m.shot)?m.shot:'normal';target.value=clamp(Number(m.target)||90,10,110);lie.value=lies[m.lie]?m.lie:'fairway';wind.value=clamp(+m.wind||0,-20,20);cross.value=clamp(+m.crosswind||0,-20,20);aim.value=clamp(+m.aim||0,-40,40);normalize();}
function cap(){return shot.value==='punch'?75:['flop','splash'].includes(shot.value)?100:110;}
function normalize(){if(!lies[lie.value])lie.value='fairway';if(lie.value==='greenSand'){shot.value='splash';club.value='wedge';height.value='1';}else if(shot.value==='splash')shot.value='normal';if(!clubs[club.value])club.value='driver';if(shot.value==='flop')club.value='wedge';target.max=cap();target.value=clamp(+target.value||90,10,cap());if(shot.value==='punch')height.value='-1';if(['flop','splash'].includes(shot.value))height.value='1';}
restore(window.openai?.widgetState);normalize();
function save(){window.openai?.setWidgetState({modelContent:{lie:lie.value,wind:+wind.value,crosswind:+cross.value,aim:+aim.value,club:club.value,shot:shot.value,target:+target.value,shape:+shape.value,height:+height.value,strength:+strength.value,lastShot:last},privateContent:null})?.catch(()=>{});}
window.addEventListener('openai:set_globals',e=>{if(phase==='ready'){restore(e.detail?.globals?.widgetState);settings();}});
function windowMs(p){const base=shot.value==='splash'?115:clubs[club.value].window;return Math.max(25,base-lies[lie.value].window-24*Math.abs(+shape.value)*(+strength.value/100)-14*Math.abs(+height.value)-Math.max(0,p-100)*(lie.value==='deep'?4:2.5)-(shot.value==='flop'?30:shot.value==='punch'?8:0));}
function powerTolerance(){return shot.value==='flop'?1.5:+target.value<60?2:3;}
function exposure(){return +height.value===1?1.4:+height.value===-1?.55:1;}
function windFactor(){return 1+(+wind.value)*.009*exposure();}
function suggestedPower(){const ideal=+target.value/windFactor();return clamp(ideal,10,cap());}
function calmCarry(p){const effective=lie.value==='deep'?Math.min(p,85)+Math.max(0,p-85)*.3:p;return clubs[club.value].carry*effective/100*(shot.value==='splash'?.32:shot.value==='flop'?.5:shot.value==='punch'?.8:+height.value===1?.94:+height.value===-1?.96:1)*lies[lie.value].carry;}
function carryFor(p){return calmCarry(p)*windFactor();}
function drift(p){return +cross.value*.65*exposure()*carryFor(p)/150;}
function spinFactor(){return lies[lie.value].spin;}
function powerMeter(){renderTrack();}
function rules(){q('rules').textContent=clubs[club.value].name+' · '+lies[lie.value].name+' · Strike ±'+Math.round(windowMs(powerLocked?power:suggestedPower()))+' ms · Power ±'+powerTolerance()+'% · Return 1.2 s'+(lie.value==='deep'?' · Effective power soft ceiling 85%':'')+(shot.value==='splash'?' · Splash scale 0–29 yd':shot.value==='punch'?' · Low flight, 75% cap':shot.value==='flop'?' · High flight, contact penalty ×1.8':'');}
function position(){renderTrack();}
function settings(){normalize();q('strength-value').textContent=strength.value+'%';q('target-value').textContent=target.value+'%';q('wind-value').textContent=+wind.value===0?'Calm':Math.abs(+wind.value)+' mph '+(+wind.value<0?'headwind':'tailwind');q('cross-value').textContent=+cross.value===0?'Calm':Math.abs(+cross.value)+' mph '+(+cross.value<0?'to left':'to right');q('aim-value').textContent=Math.abs(+aim.value)+' yd '+(+aim.value<0?'left':+aim.value>0?'right':'center');if(phase==='ready'){powerMeter();q('value').textContent='Suggested '+suggestedPower().toFixed(1)+'% · Goal '+Math.round(calmCarry(+target.value))+' yd'+(+target.value/windFactor()>cap()?' · Beyond power cap':'');}rules();draw();renderTrack();}
function lock(v){[shape,height,strength,club,shot,target,lie,wind,cross,aim].forEach(el=>el.disabled=v);q('shape-pick').disabled=v;q('flight-pick').disabled=v||lie.value==='greenSand';club.disabled=v||lie.value==='greenSand';shot.disabled=v||lie.value==='greenSand';height.disabled=v||shot.value!=='normal';q('cancel').disabled=!v;}
function reset(){cancelAnimationFrame(raf);phase='ready';elapsed=0;powerLocked=false;powerMark=null;accuracyMark=null;button.textContent='Swing';q('phase').textContent='1 · Start swing';lock(false);settings();}
function tick(t){elapsed=t-start;if(!powerLocked&&elapsed>=powerDuration){cancelAnimationFrame(raf);phase='ready';q('phase').textContent='Power click missed';q('result').textContent='Try again';lock(false);renderTrack();return;}if(elapsed>=powerDuration+curveDuration+strikeDuration){elapsed=powerDuration+curveDuration+strikeDuration;accuracyMark=0;finish(strikeDuration/2);return;}if(elapsed>=powerDuration+curveDuration){phase='strike';q('phase').textContent='3 · Set accuracy';}else if(elapsed>=powerDuration){phase='curve';q('phase').textContent='Turning · accuracy next';}renderTrack();raf=requestAnimationFrame(tick);}
function beginStrike(){powerLocked=true;powerMark=elapsed/powerDuration;q('phase').textContent='Power locked · cursor continues';q('result').textContent=Math.round(power)+'% power locked';rules();renderTrack();}
function swing(now=performance.now()){if(phase==='ready'){cancelAnimationFrame(raf);phase='power';start=now;elapsed=0;powerLocked=false;powerMark=null;accuracyMark=null;lock(true);q('phase').textContent='2 · Set power';q('result').textContent='';renderTrack();raf=requestAnimationFrame(tick);return;}elapsed=now-start;if(!powerLocked){if(elapsed>=powerDuration){reset();q('result').textContent='Power click missed · try again';return;}power=clamp(elapsed/powerDuration*110,0,cap());beginStrike();return;}if(elapsed<powerDuration+curveDuration){q('result').textContent='Power locked · wait for the accuracy bar';return;}elapsed=Math.min(elapsed,powerDuration+curveDuration+strikeDuration);accuracyMark=1-(elapsed-powerDuration-curveDuration)/strikeDuration;finish(elapsed-powerDuration-curveDuration-strikeDuration/2);}
function finish(e){cancelAnimationFrame(raf);error=e;const w=windowMs(power),severity=Math.max(0,Math.abs(e)-w)/250;const over=Math.max(0,power-100)/10;const multiplier=(1+over*(lie.value==='deep'?1.6:.8))*(shot.value==='flop'?1.8:shot.value==='splash'?1.3:1);const loss=clamp(severity*(lie.value==='fairwaySand'?.7:.3)*multiplier,0,.8);const carry=carryFor(power)*(1-loss);const lateral=Math.sign(e)*Math.max(0,Math.abs(e)-w)/600*75*multiplier;const powerError=power-suggestedPower();last={lie:lie.value,wind:+wind.value,crosswind:+cross.value,aim:+aim.value,drift:drift(power),spin:spinFactor(),club:club.value,shot:shot.value,target:+target.value,power:Math.round(power),timingMs:Math.round(e),carryYards:Math.round(carry),shape:+shape.value,height:+height.value,strength:+strength.value,lateral};q('result').textContent=(Math.abs(e)<=w?'Clean strike':lie.value==='fairwaySand'?'Heavy contact · short':e<0?'Early · pulled left':'Late · pushed right')+' · Power '+Math.round(power)+'% ('+(powerError>=0?'+':'')+powerError.toFixed(1)+'%)'+(Math.abs(powerError)<=powerTolerance()?' on target':' off target')+' · '+Math.round(e)+' ms · '+Math.round(carry)+' yd carry';phase='ready';button.textContent='Swing';q('phase').textContent='Shot complete';lock(false);draw();renderTrack();save();root.dispatchEvent(new CustomEvent('golf-shot',{bubbles:true,detail:{...last}}));}
const lieArt={fairway:'fairway.webp',light:'light.webp',deep:'deep.webp',fairwaySand:'fairway-sand.webp',greenSand:'greenside-sand.webp',green:'green.webp',tree:'tree.webp',tee:'tee.webp'};
function draw(){renderPicks();q('club-summary').textContent=clubs[club.value].name.toUpperCase();{const el=q('lie-summary'),pic=lieArt[lie.value];el.textContent=pic?'':lies[lie.value].name;el.style.backgroundImage=pic?"url('lies/"+pic+"')":'';el.className=pic?'lie-pic':'sub';}q('shape-summary').textContent=(+shape.value<0?'DRAW':+shape.value>0?'FADE':'STRAIGHT')+(+shape.value?' '+strength.value+'%':'');q('height-summary').textContent=+height.value<0?'LOW FLIGHT':+height.value>0?'HIGH FLIGHT':'NORMAL HEIGHT';}
function renderTrack(){const svg=q('track'),width=Math.max(260,svg.getBoundingClientRect().width),left=15,right=width-55,len=right-left,top=55,bottom=145,r=45;svg.setAttribute('viewBox','0 0 '+width+' 220');const targetX=left+len*suggestedPower()/110,center=left+len/2,zone=len*windowMs(powerLocked?power:suggestedPower())/strikeDuration,tolerance=len*powerTolerance()/110;let x=left,y=top;if(elapsed<=powerDuration){x=left+len*clamp(elapsed/powerDuration,0,1);}else if(elapsed<powerDuration+curveDuration){const a=-Math.PI/2+(elapsed-powerDuration)/curveDuration*Math.PI;x=right+r*Math.cos(a);y=100+r*Math.sin(a);}else{x=right-len*clamp((elapsed-powerDuration-curveDuration)/strikeDuration,0,1);y=bottom;}const mark=(f,yy)=>f===null?'':'<line x1="'+(left+len*f)+'" x2="'+(left+len*f)+'" y1="'+(yy-16)+'" y2="'+(yy+16)+'" stroke="#f4f5ef" stroke-width="2"/><path d="M '+(left+len*f-5)+' '+(yy-24)+' h 10 l -5 6 Z" fill="#f4f5ef"/>';svg.innerHTML='<title>Power moves right, turns through the curve, then accuracy moves left</title><defs><linearGradient id="gb-lane-color" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6555"/><stop offset=".45" stop-color="#ff6555"/><stop offset=".65" stop-color="#167b8b"/><stop offset="1" stop-color="#11acbe"/></linearGradient><pattern id="gb-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="7" stroke="#c8cdbf" stroke-opacity=".45" stroke-width="2"/></pattern></defs><text x="'+left+'" y="20">POWER →</text><text x="'+right+'" y="20" text-anchor="end">'+(powerLocked?Math.round(power)+'% locked':suggestedPower().toFixed(1)+'% target')+'</text><path d="M '+left+' '+top+' H '+right+' A 45 45 0 0 1 '+right+' '+bottom+' H '+left+'" fill="none" stroke="url(#gb-lane-color)" stroke-width="22" stroke-linecap="round"/><rect x="'+(left+len*Math.min(cap(),100)/110)+'" y="44" width="'+(len*(110-Math.min(cap(),100))/110)+'" height="22" fill="url(#gb-hatch)"/><rect x="'+Math.max(left,targetX-tolerance)+'" y="44" width="'+Math.min(tolerance*2,right-Math.max(left,targetX-tolerance))+'" height="22" fill="#ffb19c"/><rect x="'+(center-zone)+'" y="134" width="'+(zone*2)+'" height="22" fill="#22eee3"/><line x1="'+center+'" x2="'+center+'" y1="129" y2="161" stroke="#e9ffff" stroke-width="2"/>'+mark(powerMark,top)+mark(accuracyMark,bottom)+'<circle cx="'+x+'" cy="'+y+'" r="9" fill="#ffffff" stroke="#101518" stroke-width="2"/><text x="'+left+'" y="95">0%</text><text x="'+right+'" y="95" text-anchor="end">'+(cap()<110?cap()+'% cap':'100–110%')+'</text><text x="'+left+'" y="190">LATE</text><text x="'+center+'" y="190" text-anchor="middle">ACCURACY ←</text><text x="'+right+'" y="190" text-anchor="end">EARLY</text>';}
function inputTime(e){const now=performance.now();return Number.isFinite(e.timeStamp)&&Math.abs(now-e.timeStamp)<10000?e.timeStamp:now;}
button.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();button.focus();swing(inputTime(e));});
button.addEventListener('click',e=>{if(e.detail===0)swing(inputTime(e));});q('cancel').addEventListener('click',reset);root.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)&&e.target!==q('cancel')){e.preventDefault();if(!e.repeat)swing(inputTime(e));}});root.addEventListener('keyup',e=>{if((e.code==='Space'||e.code==='Enter')&&e.target===button)e.preventDefault();});
[shape,height,strength,club,shot,target,lie,wind,cross,aim].forEach(el=>el.addEventListener('input',()=>{if(el===club&&shot.value==='flop'&&club.value!=='wedge')shot.value='normal';last=null;normalize();lock(false);settings();save();}));const shapePick=q('shape-pick'), flightPick=q('flight-pick');
let flightClub=null;
function flightOf(){return shot.value==='punch'?'low':shot.value==='flop'?'flop':+height.value===1?'high':'normal';}
function renderPicks(){
  shapePick.value=String(shape.value);
  if(flightClub!==club.value){
    flightClub=club.value;
    const opts=[['normal','Normal flight'],['low','Low (punch)'],['high','High']];
    if(club.value==='wedge')opts.push(['flop','High flop · wedge only']);
    flightPick.innerHTML=opts.map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join('');
  }
  flightPick.value=flightOf();
}
shapePick.addEventListener('input',()=>{shape.value=shapePick.value;shape.dispatchEvent(new Event('input'));});
flightPick.addEventListener('input',()=>{const f=flightPick.value;shot.value=f==='low'?'punch':f==='flop'?'flop':'normal';shot.dispatchEvent(new Event('input'));if(f==='normal'||f==='high'){height.value=f==='high'?'1':'0';height.dispatchEvent(new Event('input'));}});
root.golfSwing={configure(options={}){if(phase!=='ready')return false;if(options.speed!=null){const f=Math.min(1.4,Math.max(0.7,+options.speed));powerDuration=Math.round(1400*f);curveDuration=Math.round(267*f);strikeDuration=Math.round(764*f);}for(const [key,value] of Object.entries(options)){const inputs={club,shot,lie,wind,crosswind:cross,aim,target,shape,height,strength};if(inputs[key])inputs[key].value=String(value);}reset();last=null;normalize();lock(false);settings();return true;},cancel:reset};new ResizeObserver(renderTrack).observe(q('track'));reset();
})();
</script>

</body></html>
